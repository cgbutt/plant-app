name: Validate Leafy Dashboard

on:
  push:
    branches:
      - design/leafy-home-dashboard-light-dark
  pull_request:
    paths:
      - 'src/components/leafy/**'
      - 'src/leafy-theme.css'
      - 'package*.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
